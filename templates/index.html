<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Risk Predictor</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 text-white text-center">
            <h1 class="text-2xl font-bold tracking-tight">Heart Disease Prediction Portal</h1>
            <p class="text-blue-100 mt-1 text-sm">Input patient metrics to run the classification model diagnostic.</p>
        </div>

        <form id="predictionForm" class="p-8 space-y-6">
            
            <div>
                <h2 class="text-md font-semibold text-slate-700 uppercase tracking-wider border-b border-slate-200 pb-2 mb-4">1. Patient Demographics & Vitals</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Age</label>
                        <input type="number" name="age" required min="1" max="120" placeholder="e.g., 54" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Sex</label>
                        <select name="sex" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="1">Male</option>
                            <option value="0">Female</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Resting Blood Pressure (mm Hg)</label>
                        <input type="number" name="trestbps" required min="50" max="250" placeholder="e.g., 130" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Serum Cholesterol (mg/dl)</label>
                        <input type="number" name="chol" required min="100" max="600" placeholder="e.g., 240" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Max Heart Rate Achieved</label>
                        <input type="number" name="thalach" required min="60" max="220" placeholder="e.g., 150" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">ST Depression (Oldpeak)</label>
                        <input type="number" name="oldpeak" required step="0.1" min="0" max="10" placeholder="e.g., 1.5" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
            </div>

            <div>
                <h2 class="text-md font-semibold text-slate-700 uppercase tracking-wider border-b border-slate-200 pb-2 mb-4">2. Clinical & Diagnostic Results</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Chest Pain Type (CP)</label>
                        <select name="cp" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="0">Typical Angina (0)</option>
                            <option value="1">Atypical Angina (1)</option>
                            <option value="2">Non-anginal Pain (2)</option>
                            <option value="3">Asymptomatic (3)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Fasting Blood Sugar > 120 mg/dl</label>
                        <select name="fbs" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="0">False (0)</option>
                            <option value="1">True (1)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Resting Electrocardiographic Results</label>
                        <select name="restecg" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="0">Normal (0)</option>
                            <option value="1">ST-T Wave Abnormality (1)</option>
                            <option value="2">Left Ventricular Hypertrophy (2)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Exercise Induced Angina</label>
                        <select name="exang" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="0">No (0)</option>
                            <option value="1">Yes (1)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Slope of Peak Exercise ST Segment</label>
                        <select name="slope" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="0">Upsloping (0)</option>
                            <option value="1">Flat (1)</option>
                            <option value="2">Downsloping (2)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Number of Major Vessels Colored by Flourosopy</label>
                        <select name="ca" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-slate-600 mb-1">Thalassemia Type (Thal)</label>
                        <select name="thal" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="1">Normal (1)</option>
                            <option value="2">Fixed Defect (2)</option>
                            <option value="3">Reversable Defect (3)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg shadow transition duration-150 cursor-pointer">
                    Analyze Risk Profile
                </button>
            </div>
        </form>

        <div id="resultBox" class="hidden p-6 border-t border-slate-100 text-center">
            <h3 class="text-lg font-semibold text-slate-800">Diagnostic Result</h3>
            <p id="resultText" class="mt-2 text-xl font-bold"></p>
        </div>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Extract values directly from the form
            const formData = new FormData(e.target);
            const data = {};
            
            formData.forEach((value, key) => {
                // Convert numerical strings to standard numbers for the ML pipeline
                data[key] = value.includes('.') ? parseFloat(value) : parseInt(value);
            });

            // Log JSON structure to verify it matches the model payload format
            console.log("Payload sending to model backend:", JSON.stringify(data));

            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');
            
            resultBox.classList.remove('hidden');
            resultText.innerText = "Processing clinical values...";
            resultText.className = "mt-2 text-xl font-bold text-slate-500";

            try {
                // Connect back-end API route here (e.g., http://127.0.0.1:5000/predict)
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                // Present classification output dynamically
                if (result.prediction === 1) {
                    resultText.innerText = "High Risk: Heart Disease Indicated";
                    resultText.className = "mt-2 text-xl font-bold text-red-600";
                } else {
                    resultText.innerText = "Low Risk: Normal Screening";
                    resultText.className = "mt-2 text-xl font-bold text-green-600";
                }
            } catch (error) {
                // Soft fallback to see the compiled schema locally if no backend is up yet
                resultText.innerText = "Sent data successfully! (Backend API not linked yet)";
                resultText.className = "mt-2 text-sm text-amber-600 font-mono text-left bg-slate-100 p-3 rounded block whitespace-pre-wrap";
                resultText.innerText += `\n\nGenerated Payload Object:\n${JSON.stringify(data, null, 2)}`;
            }
        });
    </script>
</body>
</html>
